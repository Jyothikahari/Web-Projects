<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Boutique - Feedback</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <div class="promo-bar">✨ Free shipping on orders above ruppees 1000 · 20% OFF with code: SAVE20 ✨</div>

  <header class="main-header">
    <h1 class="logo">Boutique</h1>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="cart.html">Cart</a></li>
        <li><a href="feedback.html">Feedback</a></li>
        <li id="login-link"><a href="login.html">Login</a></li>
        <li id="signup-link"><a href="signup.html">Signup</a></li>
        <li id="user-menu" style="display: none;">
          <span id="username"></span>
          <a href="#" id="logout">Logout</a>
        </li>
      </ul>
    </nav>
  </header>

  <section class="feedback-container">
    <h1>We Value Your Feedback</h1>
    <form class="feedback-form" id="feedbackForm">
      <input type="text" id="name" placeholder="Your Name" required>
      <input type="email" id="email" placeholder="Your Email" required>
      <textarea id="message" placeholder="Your Feedback" required></textarea>
      <button type="submit">Submit Feedback</button>
    </form>
    <p class="feedback-message" id="feedbackMessage"></p>
  </section>

  <footer>
    <p>© 2025 Boutique. All rights reserved.</p>
  </footer>
  <script src="feedback.js"></script>
</body>
</html>
