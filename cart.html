<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Boutique - Cart</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <div class="promo-bar">✨ Free shipping on orders above ruppees 1000 · 20% OFF with code: SAVE20 ✨</div>

  <header class="main-header">
    <h1 class="logo">Boutique</h1>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="cart.html">Cart</a></li>
        <li><a href="feedback.html">Feedback</a></li>
        <li id="login-link"><a href="login.html">Login</a></li>
        <li id="signup-link"><a href="signup.html">Signup</a></li>
        <li id="user-menu" style="display: none;">
          <span id="username"></span>
          <a href="#" id="logout">Logout</a>
        </li>
      </ul>
    </nav>
  </header>

  <section class="cart-container">
    <h1>Your Cart</h1>
    <div class="cart-items" id="cartItems">
      <!-- Cart items will be dynamically inserted here -->
    </div>
    <div class="cart-total" id="cartTotal">Total: ₹0</div>
    <div class="checkout-section" id="checkoutSection" style="display: none;">
      <h2>Checkout</h2>
      <p>Total Amount: <span id="checkoutTotal">₹0</span></p>
      <label for="paymentMode">Select Payment Mode:</label>
      <select id="paymentMode" required>
        <option value="" disabled selected>Select a payment method</option>
        <option value="credit_card">Credit Card</option>
        <option value="upi">UPI</option>
        <option value="cod">Cash on Delivery</option>
      </select>
      <button id="confirmPurchase">Confirm Purchase</button>
      <p class="purchase-message" id="purchaseMessage"></p>
    </div>
  </section>

  <footer>
    <p>© 2025 Boutique. All rights reserved.</p>
  </footer>
  <script src="cart.js"></script>
</body>
</html>
